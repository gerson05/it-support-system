version: '3.9'

services:
  # ── MariaDB ───────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: it-mariadb
    restart: unless-stopped
    env_file:
      - env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE:      ${DB_NAME:-it_tickets}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASS}
    volumes:
      - it_mariadb:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Aplicación principal ──────────────────────────────
  it-support:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/gerson05/it-support-system:latest
    container_name: it-support-system
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.scope=it-tickets"

    # Carga todas las variables del archivo env (incluye DB_HOST, DB_PORT, DB_USER, DB_PASS, DB_NAME)
    env_file:
      - env

    ports:
      - "${PORT:-3000}:3000"

    environment:
      # Servidor
      PORT: 3000
      NODE_ENV: production
      APP_URL: ${APP_URL:-}

      # ── IA / LLM + Embeddings (Ollama) ─────────────────
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      LLM_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # ── Google Sheets ────────────────────────────────────
      GOOGLE_SHEETS_CSV_URL: ${GOOGLE_SHEETS_CSV_URL:-}
      GOOGLE_APPS_SCRIPT_URL: ${GOOGLE_APPS_SCRIPT_URL:-}
      REGISTROS_SCRIPT_URL: ${REGISTROS_SCRIPT_URL:-}
      REGISTROS_SHEET_URL: ${REGISTROS_SHEET_URL:-}

      # ── ERP Medivalle (GeneXus scraper sync) ─────────────
      ERP_USER: ${ERP_USER:-}
      ERP_PASS: ${ERP_PASS:-}
      ERP_EMPLEADOS_OBJ: ${ERP_EMPLEADOS_OBJ:-}
      ERP_SYNC_INTERVAL_HOURS: ${ERP_SYNC_INTERVAL_HOURS:-24}

      # ── Toggles de workers ───────────────────────────────
      DISABLE_WHATSAPP: ${DISABLE_WHATSAPP:-false}
      DISABLE_INACTIVITY_MONITOR: ${DISABLE_INACTIVITY_MONITOR:-false}
      DISABLE_OFFLINE_CHECKER: ${DISABLE_OFFLINE_CHECKER:-false}
      DISABLE_TUNNEL: ${DISABLE_TUNNEL:-false}

    volumes:
      # Solo uploads y exports — ya no se necesita volumen de SQLite
      - it_uploads:/app/uploads
      - it_exports:/app/exports
      # Sesión de WhatsApp (evita re-escanear QR en reinicios)
      - it_wwebjs_auth:/app/.wwebjs_auth
      - it_wwebjs_cache:/app/.wwebjs_cache

    # Chromium necesita acceso a /dev/shm ampliado
    shm_size: '256mb'

    # Capacidades mínimas requeridas por Chromium headless
    cap_add:
      - SYS_ADMIN

    security_opt:
      - seccomp=unconfined

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    depends_on:
      mariadb:
        condition: service_healthy
      ollama:
        condition: service_started

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Caddy reverse proxy (HTTPS) ───────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: it-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      it-support:
        condition: service_healthy
      ollama:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ollama (LLM + embeddings local) ──────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: it-ollama
    restart: unless-stopped
    volumes:
      # Volumen nombrado — compatible con Linux y Windows
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Watchtower (auto-deploy on new GHCR image) ───────
  watchtower:
    image: containrrr/watchtower
    container_name: it-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_SCOPE: it-tickets
    command: it-support-system
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ── Volúmenes persistentes ─────────────────────────────
volumes:
  it_mariadb:
    driver: local
  it_uploads:
    driver: local
  it_exports:
    driver: local
  it_wwebjs_auth:
    driver: local
  it_wwebjs_cache:
    driver: local
  ollama_models:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
