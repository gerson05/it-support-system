name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          # PRs/releases created with GITHUB_TOKEN do not trigger other workflows,
          # so the release PR never gets its required CI checks. Set the
          # RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App token with
          # contents + pull-requests write) to fix that; falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  deploy-prod:
    name: Deploy Production
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-prod.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
