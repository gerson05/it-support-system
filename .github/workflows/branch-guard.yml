name: Branch Guard

on:
  pull_request:
    branches: [main, develop, stage]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    name: Validate PR Requirements
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR has description
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (body.trim().length < 20) {
              core.setFailed('PR description is required. Fill in the What / Why sections of the template.');
            } else {
              console.log('PR description is present.');
            }

      - name: Check base branch policy
        uses: actions/github-script@v9
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;

            // Direct pushes to main must come from stage or release-please branches
            if (base === 'main') {
              const allowed = ['stage', /^release-please--/];
              const ok = allowed.some(p => typeof p === 'string' ? head === p : p.test(head));
              if (!ok) {
                core.setFailed(
                  `PRs targeting 'main' must come from 'stage' or a release-please branch. ` +
                  `Current head: '${head}'.`
                );
              }
            }

            // PRs to stage must come from develop
            if (base === 'stage' && !head.startsWith('develop') && head !== 'develop') {
              // Allow claude/*, dependabot/* and hotfix/* branches too
              const allowedPrefixes = ['develop', 'hotfix/', 'claude/', 'dependabot/'];
              const ok = allowedPrefixes.some(p => head === p || head.startsWith(p));
              if (!ok) {
                core.warning(
                  `Heads-up: PRs to 'stage' should normally come from 'develop' or a hotfix branch. ` +
                  `Current head: '${head}'.`
                );
              }
            }

            console.log(`Base policy check passed: ${head} → ${base}`);

  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check conventional commits
        uses: actions/github-script@v9
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const pattern = /^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .{1,100}/;
            const mergePattern = /^Merge /;
            const failures = [];

            for (const { commit, sha } of commits) {
              const msg = commit.message.split('\n')[0];
              if (!pattern.test(msg) && !mergePattern.test(msg)) {
                failures.push(`${sha.slice(0, 7)}: "${msg}"`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                'The following commits do not follow conventional commit format ' +
                '(type(scope): description):\n' + failures.join('\n')
              );
            } else {
              console.log(`All ${commits.length} commits follow conventional commit format.`);
            }
